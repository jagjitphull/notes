name: Release

# Fires on any version tag (v0.1.0, v1.2.3, ...). Push a tag to cut a
# release: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Build, sign, and publish
    # 24.04+ specifically: webkit2gtk-4.1 (what Tauri 2 links against)
    # isn't available on 22.04 - see README.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev pkg-config build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci
      - run: npm ci --prefix frontend

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notes ${{ github.ref_name }}"
          releaseBody: |
            See the commit history for what changed. Download the `.deb`
            for Pop!_OS/Ubuntu 24.04+, or the `.AppImage` for any distro.
          # Draft so a person reviews and publishes it, rather than every
          # tag push immediately going live as a public release.
          releaseDraft: true
          prerelease: false
