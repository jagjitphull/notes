[package]
name = "notes"
version = "0.1.0"
description = "A minimalist, local-first note-taking app for Linux"
authors = ["jagjitphull"]
repository = "https://github.com/jagjitphull/notes"
license = "MIT"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.31", features = ["bundled-full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
walkdir = "2"
notify = "6"
notify-debouncer-mini = "0.4"
tauri-plugin-dialog = "2"
ureq = { version = "2", default-features = false, features = ["json"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-opener = "2.7.0"
# default-features pull in bzip2/zstd/lzma/aes-crypto/zopfli - this app
# only needs plain DEFLATE to zip up the notes folder for a local backup.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
